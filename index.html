<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine ❤️</title>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
* { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body {
  margin: 0;
  background: linear-gradient(135deg,#ff758c,#ff7eb3);
  color: #fff;
  overflow-x: hidden;
}

.slide {
  min-height: 100vh;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 20px;
  text-align: center;
}
.slide.active { display: flex; }

button {
  padding: 14px 28px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  transition: all .3s ease;
}

.yes {
  background: #fff;
  color: #ff4d6d;
  margin-right: 10px;
}

.no {
  background: transparent;
  border: 2px solid #fff;
  color: #fff;
  position: absolute;
}

/* GAME */
.game-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-width: 340px;
}

.tile {
  height: 70px;
  background: #fff;
  border-radius: 12px;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  cursor: pointer;
  transition: transform .4s, background .4s;
}

.tile.open, .tile.matched {
  background: #ffdee9;
  color: #ff4d6d;
  transform: scale(1.05);
}

.score {
  margin-bottom: 15px;
  font-size: 18px;
}

/* CASSETTES */
.cassettes button {
  background: rgba(255,255,255,.2);
  margin: 10px;
  color: #fff;
}

/* LETTER */
.letter {
  background: rgba(255,255,255,.15);
  padding: 25px;
  border-radius: 16px;
  max-width: 400px;
  line-height: 1.6;
  backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="flipSound" src="flip.mp3"></audio>
<audio id="winSound" src="win.mp3"></audio>

<!-- SLIDE 1 -->
<div class="slide active">
  <h1>Will you be my Valentine? ❤️</h1>
  <div>
    <button class="yes" onclick="goTo(1)">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>
</div>

<!-- SLIDE 2 GAME -->
<div class="slide">
  <h2>Collect Chocolates & Flowers 🍫🌸</h2>
  <div class="score">Score: <span id="score">0</span></div>
  <div class="game-board" id="board"></div>
</div>

<!-- SLIDE 3 MUSIC -->
<div class="slide">
  <h2>Play Our Songs 🎶</h2>
  <div class="cassettes">
    <button onclick="playSong('song1.mp3')">Cassette 1</button>
    <button onclick="playSong('song2.mp3')">Cassette 2</button>
    <button onclick="playSong('song3.mp3')">Cassette 3</button>
  </div>
</div>

<!-- SLIDE 4 LETTER -->
<div class="slide">
  <div class="letter
